<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120b2e">
  <title>Serata · giocatore</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Cinzel+Decorative:wght@700&family=Nunito:wght@400;700;800&family=Special+Elite&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/play.css">
</head>
<body data-theme="lobby">
  <canvas id="fx"></canvas>
  <div id="app">
    <header id="me" class="me" hidden>
      <span id="meAvatar" class="me__avatar"></span>
      <b id="meName" class="me__name"></b>
      <span id="meScore" class="me__score"></span>
    </header>
    <div id="countdown" class="countdown" hidden><span></span></div>
    <main id="screen"></main>
    <div class="dock">
      <button id="cardBtn" class="btn btn--ghost" hidden>🔒 La mia carta</button>
      <button id="advBtn" class="btn" hidden>Avanti ▶</button>
    </div>
  </div>
  <div id="cardOverlay" class="card-overlay" hidden></div>
  <div id="status" class="status" hidden></div>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="js/play/main.js"></script>
</body>
</html>
